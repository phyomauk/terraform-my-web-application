version: 0.2

env:
  variables:
    BUILD_SPEC_VERSION: "2026-09-09-1"

phases:
  install:
    commands:
      - (which jq) || (apt-get update && apt-get install -y jq) || true
      - echo "Installing Terraform..."
      - wget -q https://releases.hashicorp.com/terraform/1.16.1/terraform_1.16.1_linux_amd64.zip
      - unzip -o terraform_1.16.1_linux_amd64.zip
      - mv terraform /usr/local/bin/
      - terraform version
      - aws --version
      - jq --version

  pre_build:
    commands:
      - echo "Current identity"
      - aws sts get-caller-identity
      - echo "Assuming tf-admin role..."
      - CREDS=$(aws sts assume-role --role-arn ${TF_ADMIN_ROLE_ARN} --role-session-name codebuild-infra-${CODEBUILD_BUILD_NUMBER})
      - export AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r '.Credentials.AccessKeyId')
      - export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r '.Credentials.SecretAccessKey')
      - export AWS_SESSION_TOKEN=$(echo $CREDS | jq -r '.Credentials.SessionToken')

      - echo "Running as tf-runner"
      - aws sts get-caller-identity

      - echo "Fetching parameters dynamically from SSM.."

      # Fetch the input variables dynamically from SSM using the environment variable
      - export PROJECT_NAME=$(aws ssm get-parameter --name "/global/prod/project_name" --query "Parameter.Value" --output text)
      - export TF_VAR_project_name=$(aws ssm get-parameter --name "/global/prod/project_name" --query "Parameter.Value" --output text)
      - export TF_VAR_hosted_zone_id=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/hosted_zone_id" --query "Parameter.Value" --output text)
      - export TF_VAR_domain_name=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/domain_name" --query "Parameter.Value" --output text)
      - export TF_VAR_email_address=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/email_address" --query "Parameter.Value" --output text)
      - export TF_VAR_site_full_domain_name=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/site_full_domain_name" --query "Parameter.Value" --output text)
      - export TF_VAR_aws_region=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/aws_region" --query "Parameter.Value" --output text)
      - export TF_VAR_repo_owner=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/repo_owner" --query "Parameter.Value" --output text)
      - export TF_VAR_app_repo_name=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/app_repo_name" --query "Parameter.Value" --output text)
      - export TF_VAR_codeconnections_arn=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/codeconnections_arn" --query "Parameter.Value" --output text)
      - export TF_VAR_repo_name=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/repo_name" --query "Parameter.Value" --output text)
      - export TF_VAR_state_bucket_name=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/state_bucket_name" --query "Parameter.Value" --output text)
      - export TF_VAR_state_bucket_key=$(aws ssm get-parameter --name "/$PROJECT_NAME/prod/state_bucket_key" --query "Parameter.Value" --output text)


  build:
    commands:
      - cd terraform_project/environments/prod

      - terraform init

      - terraform validate

      - terraform plan -out=tfplan

      - terraform apply -auto-approve tfplan

  post_build:
    commands:
      - echo "Deployment complete"